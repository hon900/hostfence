name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }} / test and package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Older majors test compatibility, not upstream security support.
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked development dependencies
        run: npm ci
      - name: Build and run offline regressions
        run: npm test
      - name: Verify the packed consumer artifact
        run: node .github/scripts/verify-package.mjs
      - name: Check tracked files were not rewritten
        run: git diff --exit-code

  research:
    name: Node ${{ matrix.node }} / reproduce research
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [18, 26]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: research/*/package-lock.json
      - name: Install the experiments' locked historical revisions
        run: npm run research:install
      - name: Assert historical failures and corrected behavior
        run: npm run research
      - name: Check evidence snapshots and locks were not rewritten
        run: git diff --exit-code
